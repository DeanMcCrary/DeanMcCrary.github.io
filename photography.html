<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography - Dean McCrary</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #fff;
      color: #111;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }
    .logo {
      font-weight: bold;
      font-size: 1.2rem;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    .nav-links li {
      margin: 0;
    }
    .nav-links a {
      text-decoration: none;
      color: #111;
      font-size: 0.9rem;
      letter-spacing: 0.05rem;
    }
    .hero {
      padding: 3rem 2rem;
      text-align: center;
      background-color: #f9f9f9;
    }
    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: normal;
    }
    .hero p {
      font-size: 1rem;
      color: #555;
      margin: 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      padding: 3rem 2rem;
    }
    .gallery img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }
    .gallery img:hover {
      opacity: 0.85;
    }
    .image-container {
      position: relative;
    }
    .watermark {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 2px 6px;
      font-size: 0.7rem;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #999;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Dean McCrary</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="art.html">Art</a></li>
        <li><a href="it.html">I.T.</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="hero">
    <h1>Photography</h1>
    <p>A curated selection of my photographic works.</p>
  </main>

  <section class="gallery">
    <div class="image-container">
      <img src="images/DSC06446.JPG" alt="German Shepherd running towards the viewer">
      <div class="watermark">© Dean McCrary</div>
    </div>
    <div class="image-container">
      <img src="DSC06520.JPG" alt="Close up of a small bird">
      <div class="watermark">© Dean McCrary</div>
    </div>
    <div class="image-container">
      <img src="images/photo3.jpg" alt="Cityscape - Tokyo">
      <div class="watermark">© Dean McCrary</div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Dean McCrary</p>
  </footer>

  <script>
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
